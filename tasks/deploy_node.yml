# tasks/deploy_node.yml
# Included by sno_playbook.yml with `loop: "{{ sno_nodes }}"` and
# `loop_control.loop_var: node`. Everything here is scoped to one SNO node.
# Topology-specific behavior (NIC count/roles, whether a static DHCP
# reservation or Day-0 extra manifests are needed) comes from vars set in
# vars/topologies/{{ sno_topology }}.yml, not from anything in this file.

- name: "[{{ node.vm_name }}] Create installation directory"
  ansible.builtin.file:
    path: "{{ node.install_dir }}"
    state: directory
    mode: '0755'

- name: "[{{ node.vm_name }}] Create install-config.yaml from template"
  ansible.builtin.template:
    src: templates/install-config.yaml.j2
    dest: "{{ node.install_dir }}/install-config.yaml"
    mode: '0644'

- name: "[{{ node.vm_name }}] Create main OS disk image"
  ansible.builtin.command:
    cmd: "qemu-img create -f qcow2 {{ node.install_dir }}/{{ node.vm_name }}.qcow2 {{ sno_disk_gb }}G"
    creates: "{{ node.install_dir }}/{{ node.vm_name }}.qcow2"

- name: "[{{ node.vm_name }}] Create LVMS disk image"
  ansible.builtin.command:
    cmd: "qemu-img create -f qcow2 {{ node.install_dir }}/{{ node.vm_name }}-lvms.qcow2 {{ sno_lvms_disk_gb }}G"
    creates: "{{ node.install_dir }}/{{ node.vm_name }}-lvms.qcow2"

- name: "[{{ node.vm_name }}] Ensure SNO VM is defined so we can get its MAC addresses"
  community.libvirt.virt:
    command: define
    xml: "{{ lookup('template', vm_definition_template) }}"

- name: "[{{ node.vm_name }}] Get MAC addresses from the defined VM"
  community.libvirt.virt:
    command: get_xml
    name: "{{ node.vm_name }}"
  register: vm_xml_result

# regex_findall preserves document order, which matches the <interface>
# block order in this topology's vm_definition_template. If that template
# ever gets reordered, topology_mac_names' order must move with it.
- name: "[{{ node.vm_name }}] Map MAC addresses to interfaces by document order"
  ansible.builtin.set_fact:
    node_macs: "{{ dict(topology_mac_names | zip(vm_xml_result.get_xml | regex_findall(\"mac address='([^']+)'\"))) }}"

# IMPORTANT, learned the hard way (see docs/spec-test-case-3-prp-primary.md):
# openshift-install agent's "Day-0 extra manifests"
# (<install_dir>/openshift/*.yaml) do NOT land on the live boot
# filesystem. They're staged at /etc/assisted/extra-manifests/ for the
# Machine Config Operator to apply once the cluster exists - a Day-1
# mechanism, not a pre-boot one. Confirmed directly via a dracut rd.break
# shell: this file never reaches /etc/modules-load.d/ before NetworkManager
# starts. It's still worth shipping - once install succeeds, MCO applies
# it like any other MachineConfig, giving reliable module-load-on-reboot
# behavior thereafter - but it has zero effect on whether prp0 comes up at
# first boot. Turns out that doesn't matter either: the kernel's own
# `rtnl-link-hsr` module alias autoloads `hsr` on demand the moment
# NetworkManager attempts `ip link add type hsr`, confirmed working with
# no explicit modules-load.d entry needed. Left in for Day-1 robustness.
- name: "[{{ node.vm_name }}] Ensure Day-0 extra manifests directory exists"
  ansible.builtin.file:
    path: "{{ node.install_dir }}/openshift"
    state: directory
    mode: '0755'
  when: topology_needs_day0_extra_manifests | default(false)

- name: "[{{ node.vm_name }}] Place hsr module autoload as a Day-0 extra manifest"
  ansible.builtin.template:
    src: day0-manifests/99-hsr-module-autoload.yaml.j2
    dest: "{{ node.install_dir }}/openshift/99-hsr-module-autoload.yaml"
    mode: '0644'
  when: topology_needs_day0_extra_manifests | default(false)

- name: "[{{ node.vm_name }}] Create agent-config.yaml now that we have MAC addresses"
  ansible.builtin.template:
    src: "{{ agent_config_template }}"
    dest: "{{ node.install_dir }}/agent-config.yaml"
    mode: '0644'

- name: "[{{ node.vm_name }}] Create Agent Installer ISO and assets"
  ansible.builtin.command:
    cmd: "openshift-install agent create image --dir={{ node.install_dir }} --log-level=debug"
    creates: "{{ node.install_dir }}/agent.x86_64.iso"
  register: iso_result

# Confirmed working workaround for the Day-0 nmstate gen_conf bug
# (docs/prp-test-case.md's "Root cause"): AgentConfig's networkConfig
# omits `prp0` entirely for this topology (see the matching
# `{% if not topology_needs_prp_nmconnection_workaround %}` guard in
# templates/agent-config/single-primary-prp.yaml.j2), and a hand-correct
# prp0.nmconnection - the same fields nmstate already gets right for this
# exact input, plus the one missing [hsr] section - is merged directly
# into the ISO's real Ignition config instead. This is NOT the same thing
# as a "Day-0 extra manifest" above (those don't apply pre-boot at all -
# see the comment on that block); this goes through the ISO's own
# top-level ignition config via `coreos-installer iso ignition
# show`/`embed`, which does.
#
# Destination path matters and is NOT
# /etc/NetworkManager/system-connections/prp0.nmconnection, even though
# that's where the file ultimately needs to end up - confirmed the hard
# way. /usr/local/bin/pre-network-manager-config.sh (baked into the ISO's
# own ignition, runs Before=NetworkManager.service) unconditionally does
# `rm -f /etc/NetworkManager/system-connections/*` and then repopulates
# that directory only from /etc/assisted/network/host0/*.nmconnection -
# the exact same staging directory eth0.nmconnection/eth1.nmconnection
# already use. Writing straight to system-connections/ gets deleted
# before NetworkManager ever starts; writing to
# /etc/assisted/network/host0/ instead lets that script's own
# already-correct copy logic install it for us. Validated live with this
# exact path: prp0 comes up as
# `hsr slave1 enp1s0 slave2 enp6s0 ... proto 1`, node reachable over SSH.
- name: "[{{ node.vm_name }}] Render prp0.nmconnection content for the ignition-embed workaround"
  ansible.builtin.template:
    src: day0-manifests/prp0.nmconnection.j2
    dest: "/tmp/{{ node.vm_name }}-prp0.nmconnection"
    mode: '0600'
  when: (topology_needs_prp_nmconnection_workaround | default(false)) and iso_result.changed

- name: "[{{ node.vm_name }}] Embed prp0.nmconnection directly into the ISO's real ignition config"
  ansible.builtin.command:
    cmd: >
      python3 {{ playbook_dir }}/scripts/embed-day0-file.py
      {{ node.install_dir }}/agent.x86_64.iso
      /etc/assisted/network/host0/prp0.nmconnection
      /tmp/{{ node.vm_name }}-prp0.nmconnection
      0600
  when: (topology_needs_prp_nmconnection_workaround | default(false)) and iso_result.changed

- name: "[{{ node.vm_name }}] Clean up temporary prp0.nmconnection file"
  ansible.builtin.file:
    path: "/tmp/{{ node.vm_name }}-prp0.nmconnection"
    state: absent
  when: topology_needs_prp_nmconnection_workaround | default(false)

# This topology has no other way to see what happened on first boot if the
# node never gets an IP (no SSH, no oc) - RHCOS's default agent ISO kernel
# args only enable the VGA console, so virsh console/serial capture comes
# back empty. Adding ttyS0 here is what lets docs/spec-test-case-3-prp-primary.md's
# open question (installer serializer bug vs. a Day-0-manifest/module-load
# ordering issue) actually get resolved with direct evidence next time this
# topology fails, instead of staying an inference.
- name: "[{{ node.vm_name }}] Add serial console kernel args for boot-time debugging"
  ansible.builtin.command:
    cmd: "coreos-installer iso kargs modify -a 'console=tty0 console=ttyS0,115200n8' {{ node.install_dir }}/agent.x86_64.iso"
  when: (topology_needs_serial_console_debug | default(false)) and iso_result.changed

- name: "[{{ node.vm_name }}] Configure static DHCP entry"
  when: topology_needs_static_dhcp | default(true)
  block:
    - name: "[{{ node.vm_name }}] Get current '{{ topology_static_dhcp_network | default('n/a') }}' network configuration"
      community.libvirt.virt_net:
        command: get_xml
        name: "{{ topology_static_dhcp_network }}"
      register: current_net_xml
      changed_when: false

    - name: "[{{ node.vm_name }}] Add static host entry to network XML"
      community.general.xml:
        xmlstring: "{{ current_net_xml.get_xml }}"
        xpath: "/network/ip/dhcp"
        state: present
        add_children:
          - host:
              mac: "{{ node_macs.eth0 }}"
              ip: "{{ node.ip_address }}"
              name: "{{ node.hostname }}"
        pretty_print: true
      register: modified_net_xml
      changed_when: current_net_xml.get_xml != modified_net_xml.xmlstring

    - name: "[{{ node.vm_name }}] Apply updated '{{ topology_static_dhcp_network | default('n/a') }}' network configuration"
      community.libvirt.virt_net:
        command: define
        name: "{{ topology_static_dhcp_network }}"
        xml: "{{ modified_net_xml.xmlstring }}"
      when: modified_net_xml.changed
      notify: Restart libvirtd

- name: "[{{ node.vm_name }}] Start the SNO VM"
  community.libvirt.virt:
    name: "{{ node.vm_name }}"
    state: running

# node.ip_address doesn't exist for single-primary-prp (Test Case 3) -
# there, prp0 (node.prp_ip_address) is the only address the node has.
- name: "[{{ node.vm_name }}] Add API and Ingress entries to /etc/hosts"
  ansible.builtin.lineinfile:
    path: /etc/hosts
    # /etc/hosts has no wildcard support - "*.apps..." here is a silent
    # no-op, not a wildcard match. List every route host actually needed
    # (console/download/oauth) explicitly instead.
    line: "{{ node.ip_address | default(node.prp_ip_address) }} api.{{ node.hostname }}.{{ sno_domain }} console-openshift-console.apps.{{ node.hostname }}.{{ sno_domain }} downloads-openshift-console.apps.{{ node.hostname }}.{{ sno_domain }} oauth-openshift.apps.{{ node.hostname }}.{{ sno_domain }}"
    regexp: "^{{ node.ip_address | default(node.prp_ip_address) | regex_escape() }}"
    state: present

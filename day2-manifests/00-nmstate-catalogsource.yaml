# WORKAROUND, not part of the intended design: as of OCP 5.0.0-rc.2,
# kubernetes-nmstate-operator is not published in ANY default catalog
# (redhat-operators/certified-operators/community-operators all checked -
# 0 hits, despite catalogs being healthy with 85-261 other packages each).
# This is almost certainly a pre-GA catalog gap, not a permanent removal.
#
# The 4.22 redhat-operators index (the last 4.x release before 5.0) still
# carries it, and OLM on 5.0 can resolve/install it fine from there - see
# docs/prp-test-case.md for the full investigation, including why the
# catalog pod needs a few restart cycles before its gRPC server actually
# starts serving (a slow first-run cache build racing an impatient
# startup probe, not a real failure).
#
# Once kubernetes-nmstate-operator appears in OCP 5.0's own default
# redhat-operators catalog, delete this CatalogSource and point
# 01-nmstate-operator-subscription.yaml's spec.source back at
# "redhat-operators".
apiVersion: operators.coreos.com/v1alpha1
kind: CatalogSource
metadata:
  name: redhat-operators-4-22
  namespace: openshift-marketplace
spec:
  sourceType: grpc
  image: registry.redhat.io/redhat/redhat-operator-index:v4.22
  displayName: Red Hat Operators (4.22 index, for kubernetes-nmstate-operator)
  publisher: Red Hat

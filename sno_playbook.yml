---
- name: Deploy two PRP-connected Single Node OpenShift clusters on KVM
  hosts: localhost
  connection: local
  become: true
  vars_files:
    - vars/main.yml
    - "vars/topologies/{{ sno_topology }}.yml"

  tasks:
    - name: Build combined pull-secret with mirror registry credentials
      ansible.builtin.set_fact:
        sno_pull_secret_combined: >-
          {{ lookup("file", pull_secret_path) | from_json
             | combine({"auths": {mirror_registry: {"auth": (mirror_registry_user ~ ":" ~ mirror_registry_pass) | b64encode}}}, recursive=true)
             | to_json }}
      when: mirror_registry is defined

    - name: Fall back to unmodified pull-secret when no mirror is configured
      ansible.builtin.set_fact:
        sno_pull_secret_combined: "{{ lookup('file', pull_secret_path) }}"
      when: mirror_registry is not defined

    - name: Install required packages
      ansible.builtin.dnf:
        name:
          - qemu-kvm
          - libvirt-daemon
          - libvirt-daemon-driver-network
          - libvirt-daemon-driver-qemu
          - virt-install
          - libvirt-client
          - libvirt-python3
          - wget
          - xorriso
          - qemu-img
          - nmstate
        state: present

    - name: Ensure libvirtd service is started and enabled
      ansible.builtin.service:
        name: libvirtd
        state: started
        enabled: true

    - name: Configure firewalld for libvirt
      ansible.posix.firewalld:
        zone: libvirt
        service: "{{ item }}"
        state: enabled
        permanent: true
        immediate: true
      loop:
        - dhcp
        - dns
        - http
        - https
        - ntp

    - name: Allow SNO nodes to query this host's chronyd for NTP
      ansible.builtin.lineinfile:
        path: /etc/chrony.conf
        line: "allow {{ sno_machine_network_cidr }}"
        insertafter: EOF
        state: present
      notify: Restart chronyd

    - name: Allow virtualization SELinux boolean
      ansible.posix.seboolean:
        name: virt_use_execmem
        state: true
        persistent: true

    - name: Download OpenShift client
      ansible.builtin.get_url:
        url: "{{ oc_url }}"
        dest: "/tmp/openshift-client-linux.tar.gz"
        mode: '0644'

    - name: Unarchive OpenShift client
      ansible.builtin.unarchive:
        src: "/tmp/openshift-client-linux.tar.gz"
        dest: "/usr/local/bin"
        remote_src: true
        creates: /usr/local/bin/oc

    - name: Download OpenShift installer
      ansible.builtin.get_url:
        url: "{{ openshift_install_url }}"
        dest: "/tmp/openshift-install-linux.tar.gz"
        mode: '0644'

    - name: Unarchive OpenShift installer
      ansible.builtin.unarchive:
        src: "/tmp/openshift-install-linux.tar.gz"
        dest: "/usr/local/bin"
        remote_src: true
        creates: /usr/local/bin/openshift-install

    - name: Ensure VM storage base directory exists on a filesystem with room
      ansible.builtin.file:
        path: "{{ sno_storage_base }}"
        state: directory
        mode: '0711'
        owner: root
        group: root

    - name: Ensure SELinux context allows libvirt/qemu to use this storage path
      community.general.sefcontext:
        target: "{{ sno_storage_base }}(/.*)?"
        setype: virt_image_t
        state: present
      register: sno_storage_sefcontext

    - name: Apply SELinux context to any existing files under the storage path
      ansible.builtin.command: "restorecon -R {{ sno_storage_base }}"
      when: sno_storage_sefcontext.changed

    # --- Shared libvirt networks: ocp-public (NAT) + prp-lan-a/b (isolated) ---
    - name: Define shared libvirt networks
      community.libvirt.virt_net:
        command: define
        name: "{{ item.name }}"
        xml: "{{ lookup('template', item.template) }}"
      loop: "{{ sno_libvirt_networks }}"

    - name: Ensure shared libvirt networks are active
      community.libvirt.virt_net:
        command: create
        name: "{{ item.name }}"
      loop: "{{ sno_libvirt_networks }}"
      register: net_create_result
      failed_when:
        - net_create_result is failed
        - "'already active' not in (net_create_result.msg | default(''))"

    - name: Set shared libvirt networks to autostart
      community.libvirt.virt_net:
        name: "{{ item.name }}"
        autostart: true
      loop: "{{ sno_libvirt_networks }}"

    # --- Per-node deploy: repeats disk/VM/ignition/start for each SNO ---
    - name: Deploy each SNO node
      ansible.builtin.include_tasks: tasks/deploy_node.yml
      loop: "{{ sno_nodes }}"
      loop_control:
        loop_var: node
        label: "{{ node.vm_name }}"

  handlers:
    - name: Restart libvirtd
      ansible.builtin.service:
        name: libvirtd
        state: restarted

    - name: Restart chronyd
      ansible.builtin.service:
        name: chronyd
        state: restarted

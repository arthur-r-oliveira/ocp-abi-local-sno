# vars/main.yml

# VM sizing - identical for every SNO node in the fleet
# 8 vCPU is a hard floor: the agent-based installer's master-role
# validation requires >=8 CPU cores or the host is marked "insufficient"
# and bootstrap never starts.
sno_vcpu: 8
sno_ram_mb: 16384
sno_disk_gb: 120
sno_lvms_disk_gb: 50

# Shared cluster domain (each node still gets its own cluster name/subdomain)
sno_domain: "apps.lab.corp"

# Base directory for VM disk images/ISOs. Deliberately NOT under /root or
# on the root filesystem: two SNO nodes' disks can easily reach 30GB+ each
# once real installation starts writing data, so this must live on a
# filesystem with real headroom, and it must be traversable (mode 0711)
# by the unprivileged 'qemu' user libvirt runs VMs as.
sno_storage_base: "/home/libvirt-images"

# --- Libvirt networks -------------------------------------------------
# Names referenced by vm-definition.xml.j2. ocp-public is a NAT network
# shared by both nodes; prp-lan-a/prp-lan-b are isolated L2-only segments
# also shared by both nodes, which is what lets their prp0 (HSR/PRP)
# interfaces see each other over both redundant paths.
net_ocp_public: "ocp-public"
net_prp_lan_a: "prp-lan-a"
net_prp_lan_b: "prp-lan-b"

sno_libvirt_networks:
  - name: "{{ net_ocp_public }}"
    template: "templates/networks/ocp-public.xml.j2"
  - name: "{{ net_prp_lan_a }}"
    template: "templates/networks/prp-lan-a.xml.j2"
  - name: "{{ net_prp_lan_b }}"
    template: "templates/networks/prp-lan-b.xml.j2"

# ocp-public addressing (eth0/eth1, cluster API+Ingress+egress)
ocp_public_gateway: "192.168.130.1"
ocp_public_prefix: 24
ocp_public_subnet_cidr: "192.168.130.0/24"

# PRP (Parallel Redundancy Protocol, RFC 62439-3) addressing for prp0.
# Both nodes' prp0 live on this same /24, reachable over prp-lan-a AND
# prp-lan-b simultaneously. multicast-spec must match across nodes on
# the same PRP network - it seeds the supervision-frame multicast MAC
# (01:15:4E:00:01:<spec>) both LREs listen on.
prp_prefix_length: 24
prp_multicast_spec: 0

# --- Fleet: two independent SNO clusters wired into the same PRP LANs -
sno_nodes:
  - vm_name: "sno-a"
    hostname: "sno-a"
    install_dir: "{{ sno_storage_base }}/sno-install/sno-a"
    ip_address: "192.168.130.101"
    prp_ip_address: "10.10.10.1"
    # eth2 and eth3 MUST share this exact MAC: prp0 is one logical LRE
    # identity presented out both ports, and nmstate's hsr validation
    # (confirmed against nmstatectl 2.2.60) rejects differing port MACs.
    # Must differ from sno-b's, since both nodes' eth2 share prp-lan-a
    # (and eth3 shares prp-lan-b) on the wire.
    prp_mac_address: "52:54:00:aa:aa:01"
  - vm_name: "sno-b"
    hostname: "sno-b"
    install_dir: "{{ sno_storage_base }}/sno-install/sno-b"
    ip_address: "192.168.130.102"
    prp_ip_address: "10.10.10.2"
    prp_mac_address: "52:54:00:aa:aa:02"

# OpenShift Settings
openshift_version: "4.19"
ocp_release_url: "https://mirror.openshift.com/pub/openshift-v4/x86_64/clients/ocp/latest-{{ openshift_version }}"
oc_url: "{{ ocp_release_url }}/openshift-client-linux.tar.gz"
openshift_install_url: "{{ ocp_release_url }}/openshift-install-linux.tar.gz"
#agent_iso_url: "{{ ocp_release_url }}/rhcos-{{ openshift_version }}.0-x86_64-live.x86_64.iso"
agent_iso_url: https://mirror.openshift.com/pub/openshift-v4/x86_64/dependencies/rhcos/4.19/latest/rhcos-live-iso.x86_64.iso
pull_secret_path: "/root/secrets/pull-secret.json"
ssh_public_key_path: "/root/secrets/sno_id_ed25519.pub"

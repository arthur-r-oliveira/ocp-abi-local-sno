# Runs scripts/test-prp-failover.sh against the live sno-a/sno-b clusters.
#
# This CANNOT run on GitHub's hosted runners - the test needs `virsh` and
# SSH access to real libvirt VMs, which only exist on the KVM host itself.
# It needs a self-hosted runner registered ON that host (or one with
# equivalent access to it), labeled "kvm-prp-lab" below - swap that label
# for whatever you actually register, or point KUBECONFIG_A/B and
# NODE_A_IP/NODE_B_IP (as repo/environment secrets or vars) at wherever
# your deployment actually lives if it's not the defaults baked into the
# script (which match vars/main.yml's out-of-the-box values).
name: PRP failover test

on:
  workflow_dispatch: {}
  schedule:
    - cron: "0 6 * * *"  # daily, catch drift even with no code changes

jobs:
  prp-failover:
    runs-on: [self-hosted, kvm-prp-lab]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Run PRP failover test suite
        run: ./scripts/test-prp-failover.sh
